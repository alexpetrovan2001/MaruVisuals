@if (showNavbar){
  <div
    class="flex flex-col min-h-screen contact-page"
    [style.background-image]="'url(assets/images/contact/fundal_contact.jpeg)'"
    [style.background-size]="'cover'"
    [style.background-position]="'center'"
    [style.background-attachment]="'fixed'"
  >
    <app-navbar [onPhoto]="true"></app-navbar>

    <!-- Wrapper for page content -->
    <div class="flex-1" [class.animate-fadeIn]="routeTransition">
      <router-outlet></router-outlet>
    </div>

    <app-footer [transparent]="true"></app-footer>
  </div>
}
@else {
  <div [class.animate-fadeIn]="routeTransition">
    <router-outlet></router-outlet>
  </div>
}
<app-theme-toggle/>
