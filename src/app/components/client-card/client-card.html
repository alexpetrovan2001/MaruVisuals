<div class="card-container">
  <div class="relative w-full h-[50vh] sm:h-[55vh] md:h-[60vh] lg:h-[70vh] xl:h-[90vh] cursor-pointer group overflow-hidden"
    [class.snap-center]="!isFirst"
    [class.active]="isActive && mobile"
  >
    <!-- Background Image with bottom gradient -->
    <img [src]="client.sampleImage" alt="{{client.name}} image"
         [loading]="isFirst ? 'eager' : 'lazy'"
         [attr.fetchpriority]="isFirst ? 'high' : 'low'"
         decoding="async"
         class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 lg:group-hover:scale-105">
    
    <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent pointer-events-none"></div>

    <!-- Overlay (hidden by default, shows on hover) -->
    <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 transition-opacity duration-300 flex items-center justify-center lg:group-hover:opacity-100 z-10">
      <a class="view-more-link" (click)="onViewMore()">View More</a>
    </div>

    <!-- Center Logo -->
    @if(client.logo){
      <img [src]="client.logo" alt="{{client.name}} logo"
           loading="lazy" decoding="async"
           class="absolute inset-0 m-auto w-48 h-24 object-contain transition-all duration-300 lg:group-hover:opacity-0 pointer-events-none">
    }
  </div>
</div>
