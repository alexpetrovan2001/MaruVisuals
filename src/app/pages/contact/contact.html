  <!-- LAST USED FORM -->

  <div class="contact-bg">
    <div class="contact-form-wrapper">
      <h1 class="contact-heading-main">Every story starts with a conversation.</h1>
      <p class="contact-heading-sub">Reach out, and let's start shaping yours.</p>

      <form
        class="flex flex-col gap-5 max-w-sm mx-auto"
        name="contact"
        (ngSubmit)="onSubmit()"
      >
        <input type="hidden" name="form-name" value="contact" />

        <input
          type="text"
          name="name"
          [(ngModel)]="formData.name"
          placeholder="Your Name"
          required
          class="contact-field"
        />

        <input
          type="email"
          name="email"
          [(ngModel)]="formData.email"
          placeholder="Your Email"
          required
          class="contact-field"
        />

        <textarea
          name="message"
          [(ngModel)]="formData.message"
          placeholder="Your Message"
          required
          class="contact-field h-32"
        ></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </div>

  </section>
