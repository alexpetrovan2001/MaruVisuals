<div class="flex flex-col items-center justify-center w-full min-h-screen py-12 px-12 animate-fadeIn">

  <!-- Client Title -->
  <h1 class="text-2xl md:text-3xl tracking-widest text-text text-center mb-12">{{ client?.name }}.</h1>

  <!-- Collage -->
  <picture class="w-full max-w-4xl">
    <!-- Landscape (default for large screens) -->
    <source
      media="(min-aspect-ratio: 1/1)"
      [srcset]="client?.landscapeImage"
      type="image/webp"
    />
    <!-- Portrait (for phones or vertical screens) -->
    <source
      media="(max-aspect-ratio: 1/1)"
      [srcset]="client?.portraitImage"
      type="image/webp"
    />
    <!-- Fallback image -->
    <img
      [src]="client?.sampleImage"
      [alt]="client?.name + ' collage'"
      loading="lazy"
      class="object-cover w-full"
    />
  </picture>
  @if(client?.landscapeImage2 && client?.portraitImage2){
    <picture class="pt-1 w-full max-w-4xl">
      <!-- Landscape (default for large screens) -->
      <source
        media="(min-aspect-ratio: 1/1)"
        [srcset]="client?.landscapeImage2"
        type="image/webp"
      />
      <!-- Portrait (for phones or vertical screens) -->
      <source
        media="(max-aspect-ratio: 1/1)"
        [srcset]="client?.portraitImage2"
        type="image/webp"
      />
      <!-- Fallback image -->
      <img
        [src]="client?.sampleImage"
        [alt]="client?.name + ' collage'"
        loading="lazy"
        class="object-cover w-full"
      />
    </picture>
  }
  @if(client?.landscapeImage3 && client?.portraitImage3){
    <picture class="pt-1 w-full max-w-4xl">
      <source
        media="(min-aspect-ratio: 1/1)"
        [srcset]="client?.landscapeImage3"
        type="image/webp"
      />
      <source
        media="(max-aspect-ratio: 1/1)"
        [srcset]="client?.portraitImage3"
        type="image/webp"
      />
      <img
        [src]="client?.sampleImage"
        [alt]="client?.name + ' collage'"
        loading="lazy"
        class="object-cover w-full"
      />
    </picture>
  }
  @if(client?.landscapeImage4 && client?.portraitImage4){
    <picture class="pt-1 w-full max-w-4xl">
      <source
        media="(min-aspect-ratio: 1/1)"
        [srcset]="client?.landscapeImage4"
        type="image/webp"
      />
      <source
        media="(max-aspect-ratio: 1/1)"
        [srcset]="client?.portraitImage4"
        type="image/webp"
      />
      <img
        [src]="client?.sampleImage"
        [alt]="client?.name + ' collage'"
        loading="lazy"
        class="object-cover w-full"
      />
    </picture>
  }
</div>
